# Persistent boot contract for the shared Workspace CI Unix-socket parent.
# Authorization remains on each socket's distinct 0660 group.
d /run/workspace-ci 0711 root root - -

# P1 durable controller quarantine and bounded maintenance state.
d /var/lib/workspace-ci/controller/state 0700 ci-controller workspace-ci-controller - -
d /var/lib/workspace-ci/maintenance 0700 root root - -
d /var/lib/workspace-ci/maintenance-controller 0700 ci-maintenance workspace-ci-maintenance - -
