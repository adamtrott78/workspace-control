name: Workspace Shell Stale Probe Cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-probe:
    if: github.event.pull_request.number == 552 && github.actor == 'adamtrott78'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate exact stale probe identity
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "40649368609"
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID")"
          export RUN_JSON="$run_json"
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json, os
          r=json.loads(os.environ["RUN_JSON"])
          assert int(r["id"]) == 40649368609
          assert r["path"] == ".github/workflows/lambda-ci-workspace-control-validation.yml"
          assert r["event"] == "issue_comment"
          assert r["status"] in {"queued","in_progress","waiting","requested","pending","completed"}
          print(f"status={r['status']}")
          PY

      - name: Cancel exact stale probe
        if: steps.gate.outputs.status != 'completed'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "40649368609"
        shell: bash
        run: |
          set -Eeuo pipefail
          code="$(curl -sS -o /tmp/cancel.txt -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/cancel")"
          [[ "$code" == "202" ]] || {
            echo "cancel HTTP $code" >&2
            cat /tmp/cancel.txt >&2 || true
            exit 21
          }

      - name: Confirm terminal cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "40649368609"
        shell: bash
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            state="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID" \
              | python3 -c 'import json,sys; r=json.load(sys.stdin); print(f"{r.get("status")}:{r.get("conclusion")}")')"
            echo "state=$state"
            [[ "$state" == "completed:cancelled" ]] && exit 0
            sleep 1
          done
          exit 22
