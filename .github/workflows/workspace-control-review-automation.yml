name: Workspace Control Review Automation

on:
  workflow_dispatch:
    inputs:
      operation:
        required: true
        type: choice
        options: [request, consume]
      pr_number:
        required: true
        type: string
      task_id:
        required: true
        type: string
      review_kind:
        required: false
        default: implementation
        type: string
      sensitivity:
        required: false
        default: authority_sensitive
        type: choice
        options: [authority_sensitive, routine_code]
      request_comment_id:
        required: false
        type: string
      request_copilot:
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  request:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false
      - name: Create exact durable review request
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          args=(python3 scripts/workspace_review_automation.py request
            --repo "${GITHUB_REPOSITORY}"
            --pr-number "${{ inputs.pr_number }}"
            --task-id "${{ inputs.task_id }}"
            --review-kind "${{ inputs.review_kind }}"
            --sensitivity "${{ inputs.sensitivity }}")
          if [[ "${{ inputs.request_copilot }}" == "true" ]]; then
            args+=(--request-copilot)
          fi
          "${args[@]}"

  consume-dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'consume'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Consume exact durable review disposition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test -n "${{ inputs.request_comment_id }}"
          python3 scripts/workspace_review_automation.py consume \
            --repo "${GITHUB_REPOSITORY}" \
            --pr-number "${{ inputs.pr_number }}" \
            --task-id "${{ inputs.task_id }}" \
            --request-comment-id "${{ inputs.request_comment_id }}" \
            --post-receipt

  consume-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login != 'github-actions[bot]' && contains(github.event.comment.body, 'WORKSPACE_CONTROL_REVIEW_DISPOSITION_V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Resolve disposition identity
        id: binding
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import workspace_review_automation as r
          f = r.exact_block(os.environ['COMMENT_BODY'], r.DISP_START, r.DISP_END, r.DISP_KEYS)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('request_comment_id=' + f['request_comment_id'] + '\n')
              out.write('task_id=' + f['task_id'] + '\n')
              out.write('pr_number=' + f['pr_number'] + '\n')
          PY
      - name: Automatically consume disposition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 scripts/workspace_review_automation.py consume \
            --repo "${GITHUB_REPOSITORY}" \
            --pr-number "${{ steps.binding.outputs.pr_number }}" \
            --task-id "${{ steps.binding.outputs.task_id }}" \
            --request-comment-id "${{ steps.binding.outputs.request_comment_id }}" \
            --disposition-comment-id "${{ github.event.comment.id }}" \
            --post-receipt
