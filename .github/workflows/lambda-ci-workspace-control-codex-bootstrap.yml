name: Lambda CI Workspace Control Codex Bootstrap

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-bootstrap:
    name: "${{ format('wc-admission-v1|workload=codex-bootstrap|pr={0}|request={1}', github.event.issue.number, github.event.comment.body) }}"
    if: >-
      github.event.issue.pull_request &&
      github.actor == 'adamtrott78' &&
      github.event.comment.author_association == 'OWNER' &&
      (
        startsWith(github.event.comment.body, '/workspace-codex-bootstrap ') ||
        startsWith(github.event.comment.body, '/workspace-codex-preflight ') ||
        startsWith(github.event.comment.body, '/workspace-codex-calibrate ')
      )
    runs-on: lambda-workspace-control-control-small
    timeout-minutes: 10

    steps:
      - name: Verify exact same-repository PR head
        id: gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          command="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $1}')"
          extra="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $3}')"
          [[ -z "$extra" ]] || {
            echo "Codex command accepts exactly one SHA argument" >&2
            exit 19
          }
          case "$command" in
            /workspace-codex-bootstrap) mode="bootstrap" ;;
            /workspace-codex-preflight) mode="preflight" ;;
            /workspace-codex-calibrate) mode="calibrate" ;;
            *)
              echo "Unsupported Workspace Control Codex command" >&2
              exit 19
              ;;
          esac
          expected_sha="$(printf '%s\n' "$COMMENT_BODY" | awk '{print $2}')"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid /workspace-codex-bootstrap SHA" >&2
            exit 20
          }
          pr_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"
          )"
          readarray -t values < <(
            python3 -c 'import json,sys; p=json.load(sys.stdin); print(p["head"]["sha"]); print(p["head"]["repo"]["full_name"]); print(p["state"])' <<<"$pr_json"
          )
          [[ "${values[0]}" == "$expected_sha" ]] || {
            echo "Requested SHA does not match current PR head" >&2
            exit 21
          }
          [[ "${values[1]}" == "$REPOSITORY" ]] || {
            echo "Fork/foreign PR head rejected" >&2
            exit 22
          }
          [[ "${values[2]}" == "open" ]] || {
            echo "PR is not open" >&2
            exit 23
          }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"

      - name: Prove bounded workspace-control runner isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$(id -un)" == "ci-workspace-control" ]]
          [[ -n "${RUNNER_NAME:-}" ]]
          [[ "$RUNNER_NAME" == lambda-workspace-control-control-small-* ]]
          [[ -n "${RUNNER_TEMP:-}" ]]
          [[ -n "${XDG_CACHE_HOME:-}" ]]
          [[ "$XDG_CACHE_HOME" == /srv/workspace-ci/workspace-control/staging-cache/* ]]

          for forbidden in \
            /home/atrott \
            /srv/workspace-ci/research-engine \
            /srv/workspace-ci/padataset \
            /var/lib/workspace-ci/provisioner \
            /var/lib/workspace-ci/reconciler \
            /var/lib/workspace-ci/controller \
            /run/workspace-ci
          do
            [[ ! -r "$forbidden" ]] || {
              echo "Forbidden path readable: $forbidden" >&2
              exit 30
            }
          done

          for socket in /var/run/docker.sock /run/docker.sock; do
            if [[ -e "$socket" ]]; then
              [[ ! -r "$socket" && ! -w "$socket" ]] || {
                echo "Docker socket accessible: $socket" >&2
                exit 31
              }
            fi
          done

          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L >/dev/null 2>&1; then
            echo "Codex bootstrap runner unexpectedly has NVIDIA access" >&2
            exit 32
          fi

      - name: Checkout exact candidate SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.gate.outputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Install checksum-pinned Codex CLI in Workspace Control home
        if: steps.gate.outputs.mode == 'bootstrap'
        id: install
        env:
          CODEX_VERSION: "0.155.1"
          CODEX_ARCHIVE_SHA256: "a0ef8b2debc3bf747e07b1a039354de31300ac0dcc2276498ba281470b5d9115"
          CODEX_ARCHIVE_URL: "https://github.com/openai/codex/releases/download/rust-v0.155.1/codex-x86_64-unknown-linux-musl.tar.gz"
          PROJECT_HOME: "/srv/workspace-ci/workspace-control/home"
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY

          runtime_root="$PROJECT_HOME/.local/share/workspace-reasoning-economy/codex"
          install_dir="$runtime_root/$CODEX_VERSION"
          bin_dir="$PROJECT_HOME/.local/bin"
          codex_home="$PROJECT_HOME/.codex-reasoning-economy"
          archive="$RUNNER_TEMP/codex-$CODEX_VERSION.tar.gz"

          install -d -m 0700 "$runtime_root" "$install_dir" "$bin_dir" "$codex_home"

          if [[ ! -x "$install_dir/codex" ]]; then
            curl -fsSL --retry 3 -o "$archive" "$CODEX_ARCHIVE_URL"
            printf '%s  %s\n' "$CODEX_ARCHIVE_SHA256" "$archive" | sha256sum -c -
            extract_dir="$(mktemp -d "$RUNNER_TEMP/codex-extract.XXXXXX")"
            tar -C "$extract_dir" -xzf "$archive"
            source_binary="$extract_dir/codex-x86_64-unknown-linux-musl"
            [[ -f "$source_binary" ]]
            install -m 0755 "$source_binary" "$install_dir/codex"
          fi

          ln -sfn "$install_dir/codex" "$bin_dir/codex"
          actual_version="$("$install_dir/codex" --version)"
          [[ "$actual_version" == *"$CODEX_VERSION"* ]] || {
            echo "Unexpected Codex version: $actual_version" >&2
            exit 40
          }

          cat > "$codex_home/config.toml" <<'CFG'
          forced_login_method = "chatgpt"
          cli_auth_credentials_store = "file"
          CFG
          chmod 0600 "$codex_home/config.toml"

          echo "CODEX_BIN=$install_dir/codex" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          echo "CODEX_VERSION=$CODEX_VERSION" >> "$GITHUB_ENV"
          echo "codex_bin=$install_dir/codex" >> "$GITHUB_OUTPUT"
          echo "codex_home=$codex_home" >> "$GITHUB_OUTPUT"

      - name: Ensure ChatGPT login
        if: steps.gate.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY
          export CODEX_HOME

          if "$CODEX_BIN" login status 2>&1 | grep -Fq "Logged in using ChatGPT"; then
            echo "Codex ChatGPT login already present."
          else
            echo "No ChatGPT login found. Starting one-time device authorization."
            echo "Complete the device authorization shown below; no token or auth file should be copied."
            "$CODEX_BIN" login --device-auth
          fi

          status="$("$CODEX_BIN" login status 2>&1)"
          printf '%s\n' "$status" | grep -Fq "Logged in using ChatGPT"
          [[ ! -v OPENAI_API_KEY ]]
          [[ -f "$CODEX_HOME/auth.json" ]]
          chmod 0600 "$CODEX_HOME/auth.json"


      - name: Bind existing Workspace Control Codex runtime
        if: steps.gate.outputs.mode == 'preflight' || steps.gate.outputs.mode == 'calibrate'
        env:
          CODEX_VERSION: "0.155.1"
          PROJECT_HOME: "/srv/workspace-ci/workspace-control/home"
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY

          install_dir="$PROJECT_HOME/.local/share/workspace-reasoning-economy/codex/$CODEX_VERSION"
          codex_home="$PROJECT_HOME/.codex-reasoning-economy"
          codex_bin="$install_dir/codex"

          [[ -x "$codex_bin" ]] || {
            echo "Persistent Workspace Control Codex runtime is absent" >&2
            exit 41
          }
          [[ -d "$codex_home" && -f "$codex_home/config.toml" && -f "$codex_home/auth.json" ]] || {
            echo "Persistent Workspace Control Codex auth state is incomplete" >&2
            exit 42
          }
          [[ "$(stat -c '%a' "$codex_home/auth.json")" == "600" ]] || {
            echo "Persistent Workspace Control Codex auth file mode drift" >&2
            exit 43
          }

          actual_version="$("$codex_bin" --version)"
          [[ "$actual_version" == *"$CODEX_VERSION"* ]] || {
            echo "Unexpected Codex version: $actual_version" >&2
            exit 44
          }
          status="$(CODEX_HOME="$codex_home" "$codex_bin" login status 2>&1)"
          printf '%s\n' "$status" | grep -Fq "Logged in using ChatGPT"
          [[ ! -v OPENAI_API_KEY ]]

          echo "CODEX_BIN=$codex_bin" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
          echo "CODEX_VERSION=$CODEX_VERSION" >> "$GITHUB_ENV"

      - name: Read redacted ChatGPT account and usage telemetry
        if: steps.gate.outputs.mode == 'preflight'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          PROJECT_HOME: "/srv/workspace-ci/workspace-control/home"
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY
          export CODEX_HOME

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          receipt="$RUNNER_TEMP/workspace-control-codex-preflight-receipt.json"
          export RECEIPT_PATH="$receipt" ACTUAL_SHA="$actual_sha"

          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timezone
          import json
          import os
          import pathlib
          import queue
          import subprocess
          import threading

          if "OPENAI_API_KEY" in os.environ:
              raise SystemExit("OPENAI_API_KEY must be absent")

          command = [
              os.environ["CODEX_BIN"],
              "app-server",
              "--listen",
              "stdio://",
          ]
          child_env = dict(os.environ)
          child_env.pop("OPENAI_API_KEY", None)
          proc = subprocess.Popen(
              command,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
              encoding="utf-8",
              bufsize=1,
              env=child_env,
              shell=False,
          )
          if proc.stdin is None or proc.stdout is None:
              raise SystemExit("Codex app-server stdio unavailable")

          lines: queue.Queue[object] = queue.Queue()

          def read_stdout() -> None:
              try:
                  for line in proc.stdout:
                      lines.put(line)
              finally:
                  lines.put(None)

          threading.Thread(target=read_stdout, daemon=True).start()
          next_id = 1

          def write(payload: dict[str, object]) -> None:
              proc.stdin.write(
                  json.dumps(payload, separators=(",", ":"), ensure_ascii=False)
                  + "\n"
              )
              proc.stdin.flush()

          def request(method: str, params: dict[str, object] | None = None) -> dict[str, object]:
              global next_id
              request_id = next_id
              next_id += 1
              payload: dict[str, object] = {"method": method, "id": request_id}
              if params is not None:
                  payload["params"] = params
              write(payload)
              while True:
                  try:
                      item = lines.get(timeout=8.0)
                  except queue.Empty as exc:
                      raise SystemExit(f"Codex RPC timeout: {method}") from exc
                  if item is None:
                      raise SystemExit(f"Codex app-server closed: {method}")
                  try:
                      response = json.loads(str(item))
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(response, dict) or response.get("id") != request_id:
                      continue
                  if response.get("error") is not None:
                      error = response.get("error")
                      code = error.get("code") if isinstance(error, dict) else "unknown"
                      raise SystemExit(f"Codex RPC failed: {method}: code={code}")
                  return response

          def notify(method: str, params: dict[str, object]) -> None:
              write({"method": method, "params": params})

          try:
              request(
                  "initialize",
                  {
                      "clientInfo": {
                          "name": "workspace-control-codex-preflight",
                          "version": "1.0",
                      }
                  },
              )
              notify("initialized", {})
              account_response = request("account/read", {})
              rate_response = request("account/rateLimits/read")
              usage_response = request("account/usage/read")
          finally:
              try:
                  proc.stdin.close()
              except OSError:
                  pass
              if proc.poll() is None:
                  proc.terminate()
                  try:
                      proc.wait(timeout=1.0)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=1.0)

          account_result = account_response.get("result")
          if not isinstance(account_result, dict):
              raise SystemExit("account/read missing result")
          account = account_result.get("account")
          if not isinstance(account, dict):
              raise SystemExit("account/read missing account")
          account_type = account.get("type")
          plan_type = account.get("planType")
          requires_openai_auth = account_result.get("requiresOpenaiAuth")
          if account_type != "chatgpt":
              raise SystemExit("ChatGPT subscription account required")
          if not isinstance(plan_type, str) or plan_type.lower() != "plus":
              raise SystemExit("ChatGPT Plus plan required")
          if not isinstance(requires_openai_auth, bool):
              raise SystemExit("requiresOpenaiAuth must be boolean")

          def optional_int(value: object, label: str) -> int | None:
              if value is None:
                  return None
              if isinstance(value, bool) or not isinstance(value, int):
                  raise SystemExit(f"{label} must be integer or null")
              return value

          def optional_str(value: object, label: str) -> str | None:
              if value is None:
                  return None
              if not isinstance(value, str):
                  raise SystemExit(f"{label} must be string or null")
              return value

          def clean_window(raw: object) -> dict[str, object] | None:
              if raw is None:
                  return None
              if not isinstance(raw, dict):
                  raise SystemExit("rate-limit window must be object")
              used = raw.get("usedPercent")
              if isinstance(used, bool) or not isinstance(used, int):
                  raise SystemExit("rate-limit usedPercent must be integer")
              return {
                  "used_percent": used,
                  "window_duration_mins": optional_int(
                      raw.get("windowDurationMins"),
                      "windowDurationMins",
                  ),
                  "resets_at": optional_int(raw.get("resetsAt"), "resetsAt"),
              }

          def clean_bucket(raw: object, fallback_id: str | None = None) -> dict[str, object]:
              if not isinstance(raw, dict):
                  raise SystemExit("rate-limit bucket must be object")
              return {
                  "limit_id": optional_str(raw.get("limitId"), "limitId") or fallback_id,
                  "limit_name": optional_str(raw.get("limitName"), "limitName"),
                  "normal_model_slug": optional_str(
                      raw.get("normalModelSlug"),
                      "normalModelSlug",
                  ),
                  "plan_type": optional_str(raw.get("planType"), "rateLimit.planType"),
                  "primary": clean_window(raw.get("primary")),
                  "secondary": clean_window(raw.get("secondary")),
              }

          rate_result = rate_response.get("result")
          if not isinstance(rate_result, dict):
              raise SystemExit("rateLimits/read missing result")
          ordinary = rate_result.get("ordinaryUsageAllowed")
          if ordinary is not None and not isinstance(ordinary, bool):
              raise SystemExit("ordinaryUsageAllowed must be boolean or null")
          rate_limits: list[dict[str, object]] = []
          if rate_result.get("rateLimits") is not None:
              rate_limits.append(clean_bucket(rate_result["rateLimits"]))
          by_id = rate_result.get("rateLimitsByLimitId")
          if by_id is not None:
              if not isinstance(by_id, dict):
                  raise SystemExit("rateLimitsByLimitId must be object or null")
              for limit_id in sorted(by_id):
                  if not isinstance(limit_id, str):
                      raise SystemExit("rateLimitsByLimitId key must be string")
                  cleaned = clean_bucket(by_id[limit_id], limit_id)
                  if cleaned not in rate_limits:
                      rate_limits.append(cleaned)

          usage_result = usage_response.get("result")
          if not isinstance(usage_result, dict):
              raise SystemExit("usage/read missing result")
          summary_raw = usage_result.get("summary")
          if not isinstance(summary_raw, dict):
              raise SystemExit("usage summary must be object")
          token_summary = {
              "lifetime_tokens": optional_int(
                  summary_raw.get("lifetimeTokens"),
                  "lifetimeTokens",
              ),
              "peak_daily_tokens": optional_int(
                  summary_raw.get("peakDailyTokens"),
                  "peakDailyTokens",
              ),
              "longest_running_turn_sec": optional_int(
                  summary_raw.get("longestRunningTurnSec"),
                  "longestRunningTurnSec",
              ),
              "current_streak_days": optional_int(
                  summary_raw.get("currentStreakDays"),
                  "currentStreakDays",
              ),
              "longest_streak_days": optional_int(
                  summary_raw.get("longestStreakDays"),
                  "longestStreakDays",
              ),
          }
          daily = usage_result.get("dailyUsageBuckets")
          if daily is not None and not isinstance(daily, list):
              raise SystemExit("dailyUsageBuckets must be array or null")

          receipt = {
              "schema_version": 1,
              "mode": "WORKSPACE_CONTROL_CODEX_PREFLIGHT_V1",
              "decision": "PASS",
              "expected_sha": os.environ["EXPECTED_SHA"],
              "actual_sha": os.environ["ACTUAL_SHA"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_user": os.environ.get("USER"),
              "runner_class": "workspace-control-control-small-v1",
              "project_home": os.environ["PROJECT_HOME"],
              "codex_home": os.environ["CODEX_HOME"],
              "codex_version": os.environ["CODEX_VERSION"],
              "account_type": "chatgpt",
              "plan_type": plan_type.lower(),
              "requires_openai_auth": requires_openai_auth,
              "api_key_present": False,
              "model_inference_performed": False,
              "credential_material_in_receipt": False,
              "usage_snapshot": {
                  "captured_at": datetime.now(timezone.utc).isoformat(),
                  "ordinary_usage_allowed": ordinary,
                  "rate_limits": rate_limits,
                  "token_summary": token_summary,
                  "daily_usage_bucket_count": (
                      len(daily) if isinstance(daily, list) else None
                  ),
              },
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload redacted preflight receipt
        if: steps.gate.outputs.mode == 'preflight'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-control-codex-preflight-receipt
          path: ${{ runner.temp }}/workspace-control-codex-preflight-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Run one bounded Codex allowance calibration quantum
        if: steps.gate.outputs.mode == 'calibrate'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          PROJECT_HOME: "/srv/workspace-ci/workspace-control/home"
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY
          export CODEX_HOME

          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          receipt="$RUNNER_TEMP/workspace-control-codex-calibration-receipt.json"
          export RECEIPT_PATH="$receipt" ACTUAL_SHA="$actual_sha"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import subprocess
          import sys

          repo = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          sys.path.insert(0, str(repo / "semantic-execution" / "src"))

          from workspace_semantic_execution.adapters.codex_subscription import (
              CodexSubscriptionAuthGuard,
              extract_last_agent_message,
          )
          from workspace_semantic_execution.adapters.codex_usage import (
              CodexAppServerStdioSession,
              CodexUsageCollector,
              sanitized_codex_environment,
          )
          from workspace_semantic_execution.economics.codex_trace import (
              parse_codex_exec_jsonl,
          )

          if "OPENAI_API_KEY" in os.environ:
              raise SystemExit("OPENAI_API_KEY must be absent")

          child_env = sanitized_codex_environment(os.environ)
          command = (
              os.environ["CODEX_BIN"],
              "app-server",
              "--listen",
              "stdio://",
          )

          def auth_session():
              return CodexAppServerStdioSession(
                  command=command,
                  environment=child_env,
                  allowed_methods=frozenset({"account/read"}),
              )

          def usage_session():
              return CodexAppServerStdioSession(
                  command=command,
                  environment=child_env,
              )

          auth = CodexSubscriptionAuthGuard(
              session_factory=auth_session,
          ).require_authorized()
          usage = CodexUsageCollector(session_factory=usage_session)

          def clean_snapshot(snapshot):
              return {
                  "captured_at": snapshot.captured_at,
                  "ordinary_usage_allowed": snapshot.ordinary_usage_allowed,
                  "rate_limits": [
                      {
                          "limit_id": bucket.limit_id,
                          "limit_name": bucket.limit_name,
                          "normal_model_slug": bucket.normal_model_slug,
                          "plan_type": bucket.plan_type,
                          "windows": [
                              {
                                  "source_role": window.source_role,
                                  "used_percent": window.used_percent,
                                  "window_duration_mins": window.window_duration_mins,
                                  "resets_at": window.resets_at,
                                  "window_class": window.window_class.value,
                              }
                              for window in bucket.windows
                          ],
                      }
                      for bucket in snapshot.rate_limit_buckets
                  ],
                  "token_summary": {
                      "lifetime_tokens": snapshot.token_summary.lifetime_tokens,
                      "peak_daily_tokens": snapshot.token_summary.peak_daily_tokens,
                      "longest_running_turn_sec": snapshot.token_summary.longest_running_turn_sec,
                      "current_streak_days": snapshot.token_summary.current_streak_days,
                      "longest_streak_days": snapshot.token_summary.longest_streak_days,
                  },
                  "daily_usage_bucket_count": (
                      len(snapshot.daily_usage_buckets)
                      if snapshot.daily_usage_buckets is not None
                      else None
                  ),
              }

          before = usage.read_snapshot()

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codex-calibration-empty"
          work.mkdir(mode=0o700, parents=True, exist_ok=True)
          subprocess.run(
              ["git", "init", "-q", str(work)],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          schema_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codex-calibration.schema.json"
          schema_path.write_text(
              json.dumps(
                  {
                      "type": "object",
                      "additionalProperties": False,
                      "required": ["result_kind", "summary", "evidence_refs"],
                      "properties": {
                          "result_kind": {"type": "string", "enum": ["RESULT"]},
                          "summary": {"type": "string", "enum": ["CALIBRATION_OK"]},
                          "evidence_refs": {
                              "type": "array",
                              "maxItems": 0,
                              "items": {"type": "string"},
                          },
                      },
                  },
                  sort_keys=True,
              ),
              encoding="utf-8",
          )

          prompt = (
              "Perform exactly one bounded calibration response. "
              "Do not inspect files, run commands, browse, call tools, or modify state. "
              "Return only the requested machine-minimal JSON with summary CALIBRATION_OK."
          )
          exec_command = [
              os.environ["CODEX_BIN"],
              "exec",
              "--json",
              "--ephemeral",
              "--sandbox",
              "read-only",
              "--config",
              "model_reasoning_effort=low",
              "--output-schema",
              str(schema_path),
              "-",
          ]
          completed = subprocess.run(
              exec_command,
              input=prompt,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              cwd=work,
              env=child_env,
              timeout=180,
              check=False,
          )

          after = usage.read_snapshot()

          trace_error = None
          final_error = None
          trace = None
          final_payload = None
          try:
              trace = parse_codex_exec_jsonl(completed.stdout)
          except Exception as exc:
              trace_error = type(exc).__name__
          try:
              final_text = extract_last_agent_message(completed.stdout)
              if final_text is not None:
                  final_payload = json.loads(final_text)
          except Exception as exc:
              final_error = type(exc).__name__

          output_contract_passed = (
              final_payload
              == {
                  "result_kind": "RESULT",
                  "summary": "CALIBRATION_OK",
                  "evidence_refs": [],
              }
          )
          trace_passed = (
              trace is not None
              and trace.turns_started == 1
              and trace.turns_completed == 1
              and trace.turns_failed == 0
              and trace.fatal_errors == 0
              and trace.tool_calls == 0
              and trace.web_searches == 0
              and trace.file_changes == 0
          )
          decision = (
              "PASS"
              if completed.returncode == 0
              and trace_passed
              and output_contract_passed
              else "FAIL"
          )

          token_usage = None
          if trace is not None:
              token_usage = {
                  "input_tokens": trace.token_usage.input_tokens,
                  "cached_input_tokens": trace.token_usage.cached_input_tokens,
                  "cache_write_input_tokens": trace.token_usage.cache_write_input_tokens,
                  "output_tokens": trace.token_usage.output_tokens,
                  "reasoning_output_tokens": trace.token_usage.reasoning_output_tokens,
                  "total_tokens": trace.token_usage.total_tokens,
              }

          receipt = {
              "schema_version": 1,
              "mode": "WORKSPACE_CONTROL_CODEX_CALIBRATION_V1",
              "decision": decision,
              "expected_sha": os.environ["EXPECTED_SHA"],
              "actual_sha": os.environ["ACTUAL_SHA"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_user": os.environ.get("USER"),
              "runner_class": "workspace-control-control-small-v1",
              "project_home": os.environ["PROJECT_HOME"],
              "codex_home": os.environ["CODEX_HOME"],
              "codex_version": os.environ["CODEX_VERSION"],
              "surface": "CODEX",
              "isolation_verified": True,
              "model_actions": 1,
              "model_selector": "codex_cli_default",
              "reasoning_effort": "low",
              "sandbox": "read-only",
              "ephemeral": True,
              "account_type": auth.account_type,
              "plan_type": auth.plan_type,
              "requires_openai_auth": auth.requires_openai_auth,
              "api_key_present": False,
              "model_inference_performed": True,
              "credential_material_in_receipt": False,
              "prompt_material_in_receipt": False,
              "model_output_material_in_receipt": False,
              "returncode": completed.returncode,
              "trace_passed": trace_passed,
              "output_contract_passed": output_contract_passed,
              "trace_error_kind": trace_error,
              "final_output_error_kind": final_error,
              "token_usage": token_usage,
              "usage_before": clean_snapshot(before),
              "usage_after": clean_snapshot(after),
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          if decision != "PASS":
              raise SystemExit("Codex calibration quantum failed")
          PY

      - name: Upload redacted calibration receipt
        if: always() && steps.gate.outputs.mode == 'calibrate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-control-codex-calibration-receipt
          path: ${{ runner.temp }}/workspace-control-codex-calibration-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Write redacted bootstrap receipt
        if: steps.gate.outputs.mode == 'bootstrap'
        env:
          EXPECTED_SHA: ${{ steps.gate.outputs.expected_sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          PROJECT_HOME: "/srv/workspace-ci/workspace-control/home"
        shell: bash
        run: |
          set -Eeuo pipefail
          unset OPENAI_API_KEY
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          receipt="$RUNNER_TEMP/workspace-control-codex-bootstrap-receipt.json"
          export RECEIPT_PATH="$receipt" ACTUAL_SHA="$actual_sha"
          python3 - <<'PY'
          import json, os, pathlib
          payload = {
              "schema_version": 1,
              "mode": "WORKSPACE_CONTROL_CODEX_BOOTSTRAP_V1",
              "decision": "PASS",
              "expected_sha": os.environ["EXPECTED_SHA"],
              "actual_sha": os.environ["ACTUAL_SHA"],
              "pr_number": int(os.environ["PR_NUMBER"]),
              "actor": os.environ["ACTOR"],
              "runner_name": os.environ.get("RUNNER_NAME"),
              "runner_user": os.environ.get("USER"),
              "runner_class": "workspace-control-control-small-v1",
              "project_home": os.environ["PROJECT_HOME"],
              "codex_home": os.environ["CODEX_HOME"],
              "codex_version": os.environ["CODEX_VERSION"],
              "auth_mode": "chatgpt",
              "api_key_present": False,
              "model_inference_performed": False,
              "gpu_visible": False,
              "credential_material_in_receipt": False,
          }
          pathlib.Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload redacted bootstrap receipt
        if: steps.gate.outputs.mode == 'bootstrap'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-control-codex-bootstrap-receipt
          path: ${{ runner.temp }}/workspace-control-codex-bootstrap-receipt.json
