name: Sealed EXTRACT Semantic Acceptance Gold Validation

on:
  push:
    branches:
      - sealed-extract-semantic-acceptance-gold-v1
    paths:
      - "architecture/sealed/extract-semantic-acceptance/**"
      - "scripts/validate_extract_semantic_acceptance_gold.py"
      - ".github/workflows/extract-semantic-acceptance-gold-validation.yml"

permissions:
  contents: read

jobs:
  validate-sealed-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "pypdf==5.1.0" "jsonschema==4.23.0"
      - name: Validate sealed gold provenance
        run: python scripts/validate_extract_semantic_acceptance_gold.py
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-extract-semantic-acceptance-validation
          path: architecture/sealed/extract-semantic-acceptance-validation.v0.1.json
          if-no-files-found: error
