name: Operator Bridge Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'operator-bridge/**'
      - '.github/workflows/operator-bridge-validation.yml'
      - 'tasks/active/workspace-operator-bridge-implementation-v1.json'
      - 'tasks/active/workspace-operator-bridge-implementation-v1.md'
      - 'architecture/workspace-semantic-execution-operator-implementation-program.v0.1.md'
      - 'architecture/workspace-semantic-execution-operator-implementation-stage-plan.v0.1.json'
      - 'architecture/workspace-semantic-execution-operator-implementation-traceability.v0.1.json'
      - 'benchmarks/workspace-semantic-execution/operator_bridge/**'
      - 'tests/test_workspace_semantic_execution_operator_bridge*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-bridge-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: validation
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout tested tree
        uses: actions/checkout@v6

      - name: Set up .NET 10 LTS
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate frozen protocol, authority scope, and security baseline
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_workspace_semantic_execution_operator_bridge*.py" -v

      - name: Set up Node 24 for Firefox adapter tests
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Test Firefox adapter with mocked browser APIs
        shell: pwsh
        run: node --test operator-bridge/tests/FirefoxAdapter.Tests/firefox_adapter.test.js

      - name: Restore simulator solution
        shell: pwsh
        run: dotnet restore operator-bridge/WorkspaceOperatorBridge.Simulator.slnx

      - name: Build simulator solution
        shell: pwsh
        run: dotnet build operator-bridge/WorkspaceOperatorBridge.Simulator.slnx --configuration Release --no-restore

      - name: Test deterministic simulator
        shell: pwsh
        run: dotnet test operator-bridge/WorkspaceOperatorBridge.Simulator.slnx --configuration Release --no-build

      - name: Restore production solution
        shell: pwsh
        run: dotnet restore operator-bridge/WorkspaceOperatorBridge.slnx

      - name: Build production solution
        shell: pwsh
        run: dotnet build operator-bridge/WorkspaceOperatorBridge.slnx --configuration Release --no-restore

      - name: Test production solution
        shell: pwsh
        run: dotnet test operator-bridge/WorkspaceOperatorBridge.slnx --configuration Release --no-build

      - name: Restore Stage 06 integration solution
        shell: pwsh
        run: dotnet restore operator-bridge/WorkspaceOperatorBridge.Integration.slnx

      - name: Build Stage 06 integration solution
        shell: pwsh
        run: dotnet build operator-bridge/WorkspaceOperatorBridge.Integration.slnx --configuration Release --no-restore

      - name: Test Stage 06 Layer 2 real-helper mechanics
        shell: pwsh
        run: dotnet test operator-bridge/tests/LocalBridgeE2E.Tests/LocalBridgeE2E.Tests.csproj --configuration Release --no-build

      - name: Run Stage 06 Layer 3 Firefox and fake-worker integration
        shell: pwsh
        run: |
          New-Item "benchmarks/workspace-semantic-execution/operator_bridge" -ItemType Directory -Force | Out-Null
          ./operator-bridge/tools/run-stage06-firefox.ps1 -RepositoryRoot "${{ github.workspace }}" -ResultPath "${{ github.workspace }}/benchmarks/workspace-semantic-execution/operator_bridge/stage06-firefox-result.json"

      - name: Upload Stage 06 content-free integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-bridge-stage06-${{ github.sha }}
          path: benchmarks/workspace-semantic-execution/operator_bridge/stage06-firefox-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Measure helper idle resource sample
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Resolve-Path "operator-bridge/src/WorkspaceOperator/bin/Release/net10.0-windows/WorkspaceOperator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--idle-probe-ms=7000" -PassThru
          Start-Sleep -Seconds 1
          $process.Refresh()
          $startCpu = $process.TotalProcessorTime.TotalSeconds
          $started = Get-Date
          $workingSets = @()

          1..5 | ForEach-Object {
            Start-Sleep -Milliseconds 900
            if (-not $process.HasExited) {
              $process.Refresh()
              $workingSets += $process.WorkingSet64
            }
          }

          $process.WaitForExit()
          $process.Refresh()
          $elapsed = [Math]::Max(((Get-Date) - $started).TotalSeconds, 0.001)
          $cpuSeconds = [Math]::Max($process.TotalProcessorTime.TotalSeconds - $startCpu, 0)
          $cpuPercentOneLogicalCpu = [Math]::Round(($cpuSeconds / $elapsed) * 100, 4)
          $maxWorkingSetMiB = if ($workingSets.Count -gt 0) {
            [Math]::Round((($workingSets | Measure-Object -Maximum).Maximum / 1MB), 3)
          } else {
            0
          }

          $measurement = [ordered]@{
            schema_version = 1
            measurement = "stage02_helper_idle_ci_sample"
            duration_seconds = [Math]::Round($elapsed, 3)
            max_working_set_mib = $maxWorkingSetMiB
            cpu_percent_one_logical_cpu_mean = $cpuPercentOneLogicalCpu
            runner = "windows-latest"
            interpretation = "CI smoke measurement only; UX-09 target-machine measurement remains authoritative for production promotion."
          }
          $json = $measurement | ConvertTo-Json -Compress
          Write-Host "OPERATOR_BRIDGE_IDLE_MEASUREMENT=$json"
