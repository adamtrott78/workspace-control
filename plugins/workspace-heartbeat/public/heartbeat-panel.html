<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace Heartbeat</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:transparent;color:CanvasText}main{padding:18px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:14px;margin:0;font-weight:650}
.state{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:999px;padding:4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.empty{opacity:.65;font-size:14px;line-height:1.5}.history{display:flex;flex-direction:column;gap:14px}
.entry{border-top:1px solid color-mix(in srgb,CanvasText 12%,transparent);padding-top:12px}.entry:first-child{border-top:0;padding-top:0}
.message{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:0}.entry-meta,.footer{margin-top:7px;font-size:11px;opacity:.58}.error{opacity:.72}
</style>
</head>
<body>
<main>
<div class="topline"><h1>Workspace heartbeat</h1><span id="state" class="state">idle</span></div>
<div id="history" class="history"><div class="empty">No heartbeat yet.</div></div>
<div id="footer" class="footer">Waiting for the first update…</div>
</main>
<script type="module">
const ACTIVE_MS=5000,QUIET_MS=15000,ERROR_MS=30000,QUIET_AFTER_MS=60000;
const stateEl=document.getElementById("state"),historyEl=document.getElementById("history"),footerEl=document.getElementById("footer");
const persisted=window.openai?.widgetState??{};
let activeTaskId=persisted.task_id??null,knownHistory=Array.isArray(persisted.history)?persisted.history:[],busy=false,timer=null,lastUsefulAt=Date.now(),bridgeReady=false;
let rpcId=0;const pending=new Map();

function notify(method,params){window.parent.postMessage({jsonrpc:"2.0",method,params},"*")}
function request(method,params){return new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")})}
function key(x){return x.updated_at+":"+x.sequence+":"+x.task_id}
function merge(items){
 const before=knownHistory.length?key(knownHistory.at(-1)):null,byKey=new Map();
 for(const x of [...knownHistory,...(items??[])]) if(x?.task_id&&x?.updated_at) byKey.set(key(x),x);
 knownHistory=[...byKey.values()].sort((a,b)=>(Date.parse(a.updated_at)-Date.parse(b.updated_at))||(a.sequence-b.sequence)).slice(-50);
 return before!==(knownHistory.length?key(knownHistory.at(-1)):null);
}
function fmt(value){const d=new Date(value);return Number.isNaN(d.getTime())?value:d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})}
function persist(){window.openai?.setWidgetState?.({task_id:activeTaskId,history:knownHistory})}
function render(){
 if(!knownHistory.length){stateEl.textContent="idle";historyEl.innerHTML='<div class="empty">No heartbeat yet.</div>';footerEl.textContent="Waiting for the first update…";return}
 const latest=knownHistory.at(-1);activeTaskId=latest.task_id;stateEl.textContent=latest.state;
 historyEl.replaceChildren(...knownHistory.map(item=>{
  const entry=document.createElement("section");entry.className="entry";
  const msg=document.createElement("p");msg.className="message";msg.textContent=item.message;
  const meta=document.createElement("div");meta.className="entry-meta";meta.textContent="update "+item.sequence+" · "+fmt(item.updated_at)+" · "+item.state;
  entry.append(msg,meta);return entry;
 }));
 footerEl.textContent=latest.task_id+" · "+knownHistory.length+" retained update"+(knownHistory.length===1?"":"s");persist();
}
function apply(snapshot){
 if(!snapshot)return false;const incoming=Array.isArray(snapshot.history)?[...snapshot.history]:[];
 if(snapshot.heartbeat&&!incoming.length)incoming.push(snapshot.heartbeat);
 if(snapshot.heartbeat?.task_id)activeTaskId=snapshot.heartbeat.task_id;
 if(!incoming.length){if(!knownHistory.length)render();return false}
 const changed=merge(incoming);if(changed){lastUsefulAt=Date.now();render();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}return changed;
}
function fromResult(result){return result?.structuredContent??null}

window.addEventListener("message",event=>{
 if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;
 if(typeof message.id==="number"){const p=pending.get(message.id);if(!p)return;pending.delete(message.id);message.error?p.reject(message.error):p.resolve(message.result);return}
 if(message.method==="ui/notifications/tool-result")apply(fromResult(message.params));
},{passive:true});

async function initBridge(){
 try{await request("ui/initialize",{appInfo:{name:"workspace-heartbeat-panel",version:"0.3.0"},appCapabilities:{},protocolVersion:"2026-01-26"});notify("ui/notifications/initialized",{});bridgeReady=true}catch{bridgeReady=false}
}
async function callGet(args){
 if(bridgeReady)return request("tools/call",{name:"heartbeat_get",arguments:args});
 if(window.openai?.callTool)return window.openai.callTool("heartbeat_get",args);
 throw new Error("MCP Apps tool bridge is unavailable.");
}
function delay(error=false){if(error)return ERROR_MS;return Date.now()-lastUsefulAt>=QUIET_AFTER_MS?QUIET_MS:ACTIVE_MS}
function schedule(ms){if(timer)clearTimeout(timer);timer=setTimeout(reconcile,ms)}
async function reconcile(){
 if(busy){schedule(ACTIVE_MS);return}
 if(document.visibilityState!=="visible"){schedule(QUIET_MS);return}
 busy=true;let error=false;
 try{
  const result=await callGet(activeTaskId?{task_id:activeTaskId}:{});
  const snapshot=fromResult(result);
  if(snapshot?.heartbeat||snapshot?.history?.length)apply(snapshot);
 }catch(err){
  error=true;
  if(!knownHistory.length){stateEl.textContent="offline";historyEl.innerHTML='<div class="empty error">Heartbeat panel could not refresh.</div>';footerEl.textContent=err instanceof Error?err.message:String(err)}
 }finally{busy=false;schedule(delay(error))}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")schedule(0)});
apply(window.openai?.toolOutput??null);render();await initBridge();schedule(0);
</script>
</body>
</html>
