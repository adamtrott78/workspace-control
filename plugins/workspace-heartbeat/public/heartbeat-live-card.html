<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace Heartbeat Live</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:transparent;color:CanvasText}
main{padding:13px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title{font-size:12px;font-weight:650;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:999px;padding:3px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;flex:none}
.history{display:flex;flex-direction:column;min-height:300px;height:40vh;max-height:480px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}
.entry{padding:9px 0;border-top:1px solid color-mix(in srgb,CanvasText 11%,transparent)}
.entry:first-child{border-top:0;padding-top:0}
.message{margin:0;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.meta{margin-top:4px;font-size:10.5px;opacity:.48}
.footer{margin-top:7px;font-size:10.5px;opacity:.55}
.empty{font-size:13px;opacity:.62}
</style>
</head>
<body>
<main>
  <div class="top">
    <div id="title" class="title">Workspace heartbeat</div>
    <div id="state" class="state">starting</div>
  </div>
  <div id="history" class="history"><div class="empty">Waiting for current-turn progress…</div></div>
  <div id="footer" class="footer">Preparing live connection…</div>
</main>
<script type="module">
const titleEl=document.getElementById("title");
const stateEl=document.getElementById("state");
const historyEl=document.getElementById("history");
const footerEl=document.getElementById("footer");
const pending=new Map();
let nextRpcId=0;
let taskId=null;
let turnId=null;
let bridgeActive=false;
let turnActive=true;
let inFlight=false;
let timer=null;
let failures=0;
let lastKey="";

function fmt(value){
  const date=new Date(value);
  return Number.isNaN(date.getTime())?String(value):date.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
function notify(method,params){
  window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
}
function request(method,params){
  return new Promise((resolve,reject)=>{
    const id=++nextRpcId;
    const timeout=setTimeout(()=>{
      pending.delete(id);
      reject(new Error("Heartbeat bridge request timed out"));
    },7000);
    pending.set(id,{resolve,reject,timeout});
    window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");
  });
}
function clearScheduled(){
  if(timer!==null)clearTimeout(timer);
  timer=null;
}
function stopLive(reason){
  turnActive=false;
  clearScheduled();
  footerEl.textContent=reason;
}
function shouldFollowLatest(){
  if(lastKey==="")return true;
  const values=[historyEl.scrollHeight,historyEl.scrollTop,historyEl.clientHeight];
  if(values.some(value=>!Number.isFinite(value)))return true;
  return historyEl.scrollHeight-historyEl.scrollTop-historyEl.clientHeight<=48;
}
function renderSnapshot(payload){
  if(!payload||typeof payload!=="object")return false;
  const scope=payload.task_id??payload.heartbeat?.task_id??null;
  const turn=payload.turn_id??payload.heartbeat?.turn_id??null;
  if(!scope||!turn)return false;
  if(taskId&&scope!==taskId)return false;
  if(turnId&&turn!==turnId)return false;
  if(!taskId)taskId=scope;
  if(!turnId)turnId=turn;

  const recent=Array.isArray(payload.recent)?payload.recent.slice(-3):[];
  const turnHistory=Array.isArray(payload.turn_history)?payload.turn_history:recent;
  if(recent.some(item=>!item||item.task_id!==taskId||item.turn_id!==turnId))return false;
  if(turnHistory.some(item=>!item||item.task_id!==taskId||item.turn_id!==turnId))return false;
  const latest=payload.heartbeat??turnHistory.at(-1)??recent.at(-1)??null;
  if(latest&&(latest.task_id!==taskId||latest.turn_id!==turnId))return false;

  titleEl.textContent=taskId;
  if(!latest)return false;

  const key=String(latest.sequence)+":"+latest.updated_at;
  if(lastKey!==key){
    const followLatest=shouldFollowLatest();
    lastKey=key;
    const nodes=[];
    for(const item of turnHistory){
      const entry=document.createElement("section");
      entry.className="entry";
      const msg=document.createElement("p");
      msg.className="message";
      msg.textContent=item.message;
      const meta=document.createElement("div");
      meta.className="meta";
      meta.textContent=fmt(item.updated_at);
      entry.append(msg,meta);
      nodes.push(entry);
    }
    historyEl.replaceChildren(...nodes);
    if(followLatest&&Number.isFinite(historyEl.scrollHeight)){
      historyEl.scrollTop=historyEl.scrollHeight;
    }
  }

  if(payload.superseded){
    stateEl.textContent="superseded";
    stopLive("Prior assistant turn · no longer live");
  }else if(payload.completed||latest.state==="done"){
    stateEl.textContent="done";
    stopLive("Turn complete · no longer live");
  }else{
    stateEl.textContent=latest.state;
    turnActive=payload.active!==false;
    footerEl.textContent=turnHistory.length+" update"+(turnHistory.length===1?"":"s")+" · current turn · live";
  }
  return true;
}
function applyResult(result){
  const value=result?.structuredContent??result?.result?.structuredContent??result??null;
  return renderSnapshot(value);
}
function seedInput(input){
  const value=input?.arguments??input??null;
  if(typeof value?.task_id==="string"&&value.task_id.trim()&&!taskId){
    taskId=value.task_id.trim();
    titleEl.textContent=taskId;
  }
}
function schedule(delay){
  clearScheduled();
  if(!bridgeActive||!turnActive||!taskId||!turnId||document.hidden)return;
  timer=setTimeout(()=>{timer=null;void poll();},delay);
}
async function poll(){
  if(!bridgeActive||!turnActive||!taskId||!turnId||document.hidden||inFlight)return;
  inFlight=true;
  try{
    const response=await request("tools/call",{
      name:"heartbeat_snapshot",
      arguments:{task_id:taskId,turn_id:turnId}
    });
    if(response?.isError)throw new Error("Heartbeat snapshot rejected");
    const value=response?.structuredContent??response?.result?.structuredContent??null;
    if(!value||value.task_id!==taskId||value.turn_id!==turnId||!Array.isArray(value.recent)){
      throw new Error("Invalid turn-scoped heartbeat snapshot");
    }
    renderSnapshot(value);
    failures=0;
  }catch(error){
    failures=Math.min(failures+1,5);
    footerEl.textContent="Showing last known progress · reconnecting…";
  }finally{
    inFlight=false;
    if(turnActive){
      const normalDelay=stateEl.textContent==="working"?1500:3500;
      schedule(failures?Math.min(15000,normalDelay*Math.pow(2,failures)):normalDelay);
    }
  }
}
window.addEventListener("message",event=>{
  if(event.source!==window.parent)return;
  const message=event.data;
  if(!message||message.jsonrpc!=="2.0")return;
  if(typeof message.id==="number"){
    const pendingRequest=pending.get(message.id);
    if(!pendingRequest)return;
    pending.delete(message.id);
    clearTimeout(pendingRequest.timeout);
    message.error?pendingRequest.reject(message.error):pendingRequest.resolve(message.result);
    return;
  }
  if(message.method==="ui/notifications/tool-input")seedInput(message.params);
  if(message.method==="ui/notifications/tool-result")applyResult(message.params);
  if(message.method==="ui/resource-teardown"){
    bridgeActive=false;
    clearScheduled();
  }
},{passive:true});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    clearScheduled();
  }else{
    schedule(0);
  }
});
async function initializeBridge(){
  try{
    await request("ui/initialize",{
      appInfo:{name:"workspace-heartbeat-live",version:"0.4.5"},
      appCapabilities:{},
      protocolVersion:"2026-01-26"
    });
    notify("ui/notifications/initialized",{});
    bridgeActive=true;
    schedule(0);
  }catch{
    footerEl.textContent="Live refresh unavailable · showing last received progress";
  }
}
seedInput(window.openai?.toolInput??null);
applyResult(window.openai?.toolOutput??null);
void initializeBridge();
</script>
</body>
</html>
