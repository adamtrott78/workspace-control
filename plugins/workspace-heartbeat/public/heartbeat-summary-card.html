<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace Heartbeat</title>
<style>
:root{color-scheme:light dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:transparent;color:CanvasText}
main{padding:13px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.title{font-size:12px;font-weight:650;opacity:.72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);border-radius:999px;padding:3px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;flex:none}
.history{display:flex;flex-direction:column}
.entry{padding:9px 0;border-top:1px solid color-mix(in srgb,CanvasText 11%,transparent)}
.entry:first-child{border-top:0;padding-top:0}
.message{margin:0;font-size:13.5px;line-height:1.45;white-space:pre-wrap}
.meta{margin-top:4px;font-size:10.5px;opacity:.48}
.footer{margin-top:7px;font-size:10.5px;opacity:.5}
.empty{font-size:13px;opacity:.62}
</style>
</head>
<body>
<main>
<div class="top">
  <div id="title" class="title">Workspace heartbeat</div>
  <div id="state" class="state">working</div>
</div>
<div id="history" class="history"><div class="empty">No recent progress.</div></div>
<div id="footer" class="footer"></div>
</main>
<script type="module">
const titleEl=document.getElementById("title");
const stateEl=document.getElementById("state");
const historyEl=document.getElementById("history");
const footerEl=document.getElementById("footer");

function fmt(value){
  const d=new Date(value);
  return Number.isNaN(d.getTime())?value:d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
}
function render(snapshot){
  if(!snapshot)return;
  const recent=Array.isArray(snapshot.recent)?snapshot.recent.slice(-3):[];
  const latest=snapshot.heartbeat??recent.at(-1)??null;
  if(!latest){
    stateEl.textContent="idle";
    historyEl.innerHTML='<div class="empty">No recent progress.</div>';
    footerEl.textContent="";
    return;
  }
  titleEl.textContent=latest.task_id;
  stateEl.textContent=latest.state;

  const nodes=[];
  for(const item of recent){
    const entry=document.createElement("section");
    entry.className="entry";
    const msg=document.createElement("p");
    msg.className="message";
    msg.textContent=item.message;
    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent=fmt(item.updated_at);
    entry.append(msg,meta);
    nodes.push(entry);
  }
  historyEl.replaceChildren(...nodes);
  footerEl.textContent=recent.length+" recent update"+(recent.length===1?"":"s")+" · full history in heartbeat panel";
}
function apply(result){
  render(result?.structuredContent??result??null);
}
window.addEventListener("message",event=>{
  if(event.source!==window.parent)return;
  const message=event.data;
  if(!message||message.jsonrpc!=="2.0")return;
  if(message.method==="ui/notifications/tool-result")apply(message.params);
},{passive:true});
apply(window.openai?.toolOutput??null);
</script>
</body>
</html>
