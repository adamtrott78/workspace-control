# Runtime control plane. Root owns the directory; only the frontend group may traverse.
d /run/workspace-shell-control 0750 root workspace-shell-mcp - -

# Durable state.
d /var/lib/workspace-shell 0755 root root - -
d /var/lib/workspace-shell/receipts 0750 root workspace-shell-mcp - -
d /var/lib/workspace-shell/jobs 0700 root root - -
d /var/lib/workspace-shell/replay 0700 root root - -
d /var/lib/workspace-shell/helper-cache 0700 root root - -
d /var/lib/workspace-shell/frontend 0700 workspace-shell-mcp workspace-shell-mcp - -
d /var/lib/workspace-shell/tunnel 0700 workspace-shell-tunnel workspace-shell-tunnel - -

# Root-owned immutable runtime and exact source snapshot parents.
d /opt/workspace-shell 0755 root root - -
d /srv/workspace-shell 0755 root root - -
